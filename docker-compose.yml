# Woodcroft, production-shaped. One database, the API (4 uvicorn workers), one
# dedicated background worker, and the frontend behind nginx.
#
# The worker runs as its own single-replica service rather than inside the API,
# because the in-process worker in the FastAPI lifespan would otherwise run once
# per uvicorn worker and per API replica, and the same job would fire several
# times. One worker process, claiming jobs with FOR UPDATE SKIP LOCKED, is the
# safe shape.
services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: woodcroft
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
      POSTGRES_DB: woodcroft
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./scripts/init-extensions.sql:/docker-entrypoint-initdb.d/10-extensions.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U woodcroft"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    environment:
      APP_ENV: production
      DEBUG: "false"
      SECRET_KEY: ${SECRET_KEY:?set a strong SECRET_KEY}
      DATABASE_URL: postgresql+psycopg://woodcroft:${DB_PASSWORD}@db:5432/woodcroft
      PUBLIC_URL: ${PUBLIC_URL:?set PUBLIC_URL}
      CORS_ORIGINS: ${PUBLIC_URL}
      ENABLE_BACKGROUND_WORKER: "false"
      EMAIL_DRIVER: ${EMAIL_DRIVER:-outbox}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - media:/app/media
    restart: unless-stopped

  worker:
    build: ./backend
    command: python -m app.workers.standalone
    environment:
      APP_ENV: production
      DEBUG: "false"
      SECRET_KEY: ${SECRET_KEY}
      DATABASE_URL: postgresql+psycopg://woodcroft:${DB_PASSWORD}@db:5432/woodcroft
      PUBLIC_URL: ${PUBLIC_URL}
      CORS_ORIGINS: ${PUBLIC_URL}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - media:/app/media
    restart: unless-stopped
    deploy:
      replicas: 1

  web:
    build: ./frontend
    depends_on:
      - api
    ports:
      - "80:80"
    restart: unless-stopped

volumes:
  db-data:
  media:
