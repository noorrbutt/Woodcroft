<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Woodcroft — Handcrafted wood, made to keep</title>
    <meta name="description" content="Solid timber furniture and woodware, cut and joined by hand in Karachi. Sheesham, walnut, teak and mango. Delivered across Pakistan." />
    <meta name="theme-color" content="#FBF7F0" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />

    <!--
      Theme must be applied BEFORE React mounts. Doing it in an effect means
      the page paints light first and then flips, and that white flash on every
      single load is the fastest way to make a premium site feel cheap.
      Tri-state: an explicit choice is stored, "system" stores nothing.
    -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('wc-theme');
          if (saved === 'dark' || saved === 'light') {
            document.documentElement.setAttribute('data-theme', saved);
          }
        } catch (e) {
          /* private mode, blocked storage: fall through to system preference */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
