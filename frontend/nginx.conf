server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Long-cache the fingerprinted assets, never the HTML shell.
    # Security headers for the HTML shell that runs our JS (main.py's CSP only
    # covers API/JSON responses). HSTS is safe once TLS terminates in front.
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA: every unknown path falls back to index.html so client routing works
    # on a hard refresh of /product/... or /admin/...
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # The API and media are proxied to the backend service.
    location /api/ { proxy_pass http://api:8000; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
    location /media/ { proxy_pass http://api:8000; }
}
