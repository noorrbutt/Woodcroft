server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Long-cache the fingerprinted assets, never the HTML shell.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA: every unknown path falls back to index.html so client routing works
    # on a hard refresh of /product/... or /admin/...
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # The API and media are proxied to the backend service.
    location /api/ { proxy_pass http://api:8000; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
    location /media/ { proxy_pass http://api:8000; }
}
