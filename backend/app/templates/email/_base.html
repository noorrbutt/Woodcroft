<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head>
<body style="margin:0;padding:0;background:#F3EDE3;font-family:Georgia,'Times New Roman',serif;color:#2E2419;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#F3EDE3;padding:32px 16px;">
    <tr><td align="center">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:580px;background:#FBF7F0;border:1px solid #E8DFD1;">
        <tr><td style="padding:28px 32px;border-bottom:1px solid #E8DFD1;">
          <div style="font-size:20px;letter-spacing:.18em;text-transform:uppercase;color:#4A3527;">Woodcroft</div>
          <div style="font-size:12px;letter-spacing:.08em;color:#8A7862;margin-top:4px;">Handcrafted wood, made to keep</div>
        </td></tr>
        <tr><td style="padding:32px;font-size:15px;line-height:1.65;">
{% block content %}{% endblock %}
        </td></tr>
        <tr><td style="padding:20px 32px;border-top:1px solid #E8DFD1;font-size:12px;color:#8A7862;line-height:1.6;">
          &copy; {{ year }} {{ store_name }}. Lahore, Pakistan.<br>
          You are receiving this because you have an account or placed an order with us.
        </td></tr>
      </table>
    </td></tr>
  </table>
</body>
</html>
